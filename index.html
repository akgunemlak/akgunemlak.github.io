<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akgün Emlak Gayrimenkul</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1e24 0%, #2a2b36 50%, #3d2635 100%);
            background-size: cover;
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        .brand-title {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 2px 4px 10px rgba(0,0,0,0.5);
        }

        .brand-title span {
            color: #f1b813;
        }

        .brand-subtitle {
            font-size: 1.4rem;
            font-weight: 700;
            color: #d1d5db;
            letter-spacing: 4px;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .main-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            gap: 35px;
            width: 100%;
            max-width: 900px;
        }

        /* İstediğiniz İlk Hareketli Sarı Ev/Telefon Sembolü Tasarımı */
        .logo-icon {
            width: 120px;
            height: 150px;
            background-color: #f1b813;
            border-radius: 18px;
            position: relative;
            box-shadow: 0 10px 30px rgba(241, 184, 19, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: float 4s ease-in-out infinite;
        }

        .logo-icon::before {
            content: '';
            position: absolute;
            top: 35px;
            width: 0;
            height: 0;
            border-left: 30px solid transparent;
            border-right: 30px solid transparent;
            border-bottom: 30px solid #2a2b36;
        }

        .logo-icon::after {
            content: '';
            position: absolute;
            top: 65px;
            width: 44px;
            height: 40px;
            background-color: #2a2b36;
        }

        .windows {
            position: absolute;
            top: 73px;
            z-index: 2;
            width: 20px;
            height: 20px;
            display: grid;
            grid-template-columns: repeat(2, 1px);
            gap: 4px;
            background: #f1b813;
            border: 4px solid #f1b813;
        }

        .phone-button {
            position: absolute;
            bottom: 12px;
            width: 14px;
            height: 14px;
            background-color: #ffffff;
            border-radius: 50%;
        }

        .button-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #1e1e24;
            text-decoration: none;
            padding: 16px 30px;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 50px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 2px solid transparent;
            min-width: 270px;
        }

        /* Sahibinden Sarı Buton */
        .sahibinden-btn {
            background-color: #f1b813;
            box-shadow: 0 6px 20px rgba(241, 184, 19, 0.3);
        }
        .sahibinden-btn:hover {
            background-color: transparent;
            color: #f1b813;
            border-color: #f1b813;
            transform: translateY(-3px);
        }

        /* Emlakjet Yeşil Buton */
        .emlakjet-btn {
            background-color: #00d26a;
            color: #ffffff;
            box-shadow: 0 6px 20px rgba(0, 210, 106, 0.3);
        }
        .emlakjet-btn:hover {
            background-color: transparent;
            color: #00d26a;
            border-color: #00d26a;
            transform: translateY(-3px);
        }

        /* Facebook Mavi Buton */
        .facebook-btn {
            background-color: #1877f2;
            color: #ffffff;
            box-shadow: 0 6px 20px rgba(24, 119, 242, 0.3);
        }
        .facebook-btn:hover {
            background-color: transparent;
            color: #1877f2;
            border-color: #1877f2;
            transform: translateY(-3px);
        }

        footer {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid rgba(255,255,255,0.1);
            padding-top: 30px;
            margin-top: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .services-text {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .services-text span {
            color: #f1b813;
        }

        .contact-info {
            text-align: right;
        }

        .agent-name {
            font-size: 0.9rem;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 3px;
        }

        .phone-link {
            font-size: 1.6rem;
            font-weight: 800;
            color: #ffffff;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .phone-link:hover {
            color: #f1b813;
        }

        /* Sürekli Yüzen Hareket Efekti */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        @media (max-width: 768px) {
            body { padding: 20px 10px; }
            .brand-title { font-size: 2.2rem; }
            .brand-subtitle { font-size: 1rem; }
            footer { flex-direction: column; text-align: center; }
            .contact-info { text-align: center; }
            .phone-link { font-size: 1.4rem; }
            .nav-btn { min-width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <h1 class="brand-title"><span>AKGÜN</span> EMLAK</h1>
        <div class="brand-subtitle">GAYRİMENKUL</div>
    </header>

    <div class="main-container">
        <!-- Geri Getirilen Hareketli Kurumsal Sembol -->
        <div class="logo-icon">

        <div class="button-group">

            <a href="https://akgunemlakyalvac.sahibinden.com/" target="_blank" class="nav-btn sahibinden-btn">
                SAHİBİNDEN AKGÜN EMLAK
            </a>

            <!-- 1+1 Apart İlanına Yönlenen Emlakjet Butonu -->
            <a href="https://www.emlakjet.com/ilan/akgun-emlak-tan-satilik-11-tertemiz-apart-19536050" target="_blank" class="nav-btn emlakjet-btn">
                EMLAKJET AKGÜN EMLAK
            </a>

            <!-- İşletme Profiline Yönlenen Facebook Butonu -->
            <a href="https://www.facebook.com/p/AKG%C3%9CN-EMLAK-Gayrimenkul-100070590590640/" target="_blank" class="nav-btn facebook-btn">
                FACEBOOK AKGÜN EMLAK
            </a>
        </div>
    </div>

    <footer>
        <div class="services-text">
            <span>SATILIK</span> ARSA, DÜKKAN VE DAİRELER
        </div>
        <div class="contact-info">
            <div class="agent-name">Murat Akgün</div>
            <a href="tel:05332124222" class="phone-link">0 533 212 42 22</a>
        </div>
    </footer>

</body>
</html>
