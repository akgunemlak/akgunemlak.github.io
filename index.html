<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akgün Emlak Gayrimenkul</title>
    <!-- Sekmedeki küçük sarı ev logosu -->
    <link rel="icon" type="image/png" sizes="32x32" href="https://imgur.com">
    <link rel="shortcut icon" type="image/png" href="https://imgur.com">
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #141419 0%, #1e1f29 40%, #2b1f2d 100%);
            background-size: cover;
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        .brand-title {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 2px 4px 10px rgba(0,0,0,0.7);
        }

        .brand-title span {
            color: #f1b813;
        }

        .brand-subtitle {
            font-size: 1.4rem;
            font-weight: 700;
            color: #d1d5db;
            letter-spacing: 4px;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .main-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            gap: 35px;
            width: 100%;
            max-width: 900px;
        }

        /* Ortadaki Hareketli Küçük Sarı Ev Sembolü */
        .logo-icon {
            width: 110px;
            height: 140px;
            background-color: #f1b813;
            border-radius: 18px;
            position: relative;
            box-shadow: 0 10px 30px rgba(241, 184, 19, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: float 4s ease-in-out infinite;
        }

        .logo-icon::before {
            content: '';
            position: absolute;
            top: 30px;
            width: 0;
            height: 0;
            border-left: 28px solid transparent;
            border-right: 28px solid transparent;
            border-bottom: 28px solid #2a2b36;
        }

        .logo-icon::after {
            content: '';
            position: absolute;
            top: 58px;
            width: 40px;
            height: 38px;
            background-color: #2a2b36;
        }

        .windows {
            position: absolute;
            top: 66px;
            z-index: 2;
            width: 18px;
            height: 18px;
            display: grid;
            grid-template-columns: repeat(2, 1px);
            gap: 4px;
            background: #f1b813;
            border: 4px solid #f1b813;
        }

        .phone-button {
            position: absolute;
            bottom: 12px;
            width: 12px;
            height: 12px;
            background-color: #ffffff;
            border-radius: 50%;
        }

        /* Buton Grubu */
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #1e1e24;
            text-decoration: none;
            padding: 15px 25px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 50px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 2px solid transparent;
            min-width: 260px;
        }

        .sahibinden-btn {
            background-color: #f1b813;
            box-shadow: 0 6px 20px rgba(241, 184, 19, 0.3);
        }
        .sahibinden-btn:hover {
            background-color: transparent;
            color: #f1b813;
            border-color: #f1b813;
            transform: translateY(-3px);
        }

        .emlakjet-btn {
            background-color: #00d26a;
            color: #ffffff;
            box-shadow: 0 6px 20px rgba(0, 210, 106, 0.3);
        }
        .emlakjet-btn:hover {
            background-color: transparent;
            color: #00d26a;
            border-color: #00d26a;
            transform: translateY(-3px);
        }

        .facebook-btn {
            background-color: #1877f2;
            color: #ffffff;
            box-shadow: 0 6px 20px rgba(24, 119, 242, 0.3);
        }
        .facebook-btn:hover {
            background-color: transparent;
            color: #1877f2;
            border-color: #1877f2;
            transform: translateY(-3px);
        }

        /* Açılır Liste Bölümü */
        .list-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
        }

        .accordion-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .accordion-item:hover {
            border-color: rgba(241, 184, 19, 0.5);
            background: rgba(255, 255, 255, 0.08);
        }

        .accordion-input {
            display: none;
        }

        .accordion-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 25px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            user-select: none;
        }

        .accordion-label::after {
            content: '▼';
            font-size: 0.9rem;
            color: #f1b813;
            transition: transform 0.3s ease;
        }

        .accordion-content {
            max-height: 0;
            transition: max-height 0.4s ease-out;
            background: rgba(0, 0, 0, 0.3);
        }

        .accordion-content ul {
            list-style: none;
            padding: 5px 0;
        }

        .accordion-content li {
            padding: 14px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 1.05rem;
            color: #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .accordion-content li:last-child {
            border-bottom: none;
        }

        .go-btn {
            font-size: 0.85rem;
            background: #f1b813;
            color: #1e1e24;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
        }

        .accordion-input:checked ~ .accordion-content {
            max-height: 350px;
        }

        .accordion-input:checked ~ .accordion-label::after {
            transform: rotate(180deg);
        }

        footer {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid rgba(255,255,255,0.1);
            padding-top: 25px;
            margin-top: 35px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .services-text {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .services-text span {
            color: #f1b813;
        }

        .contact-info {
            text-align: right;
        }

        .agent-name {
            font-size: 0.9rem;
            color: #d1d5db;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 3px;
        }

        .phone-link {
            font-size: 1.6rem;
            font-weight: 800;
            color: #ffffff;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .phone-link:hover {
            color: #f1b813;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        @media (max-width: 768px) {
            body { padding: 20px 10px; }
            .brand-title { font-size: 2.2rem; }
            .brand-subtitle { font-size: 1rem; }
            footer { flex-direction: column; text-align: center; }
            .contact-info { text-align: center; }
            .phone-link { font-size: 1.4rem; }
            .nav-btn { min-width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <h1 class="brand-title"><span>AKGÜN</span> EMLAK</h1>
        <div class="brand-subtitle">GAYRİMENKUL</div>
    </header>

    <div class="main-container">
        <!-- Hareketli Sarı Ev Sembolü -->
        <div class="logo-icon">
            <div class="windows"></div>
            <div class="phone-button"></div>
        </div>
        
        <div class="button-group">
            <a href="https://sahibinden.com" target="_blank" class="nav-btn sahibinden-btn">
                SAHİBİNDEN AKGÜN EMLAK
